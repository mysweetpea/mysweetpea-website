<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
    <style>
      :root {
        --ground: #08090f;
        --ink: #eef0fb;
        --dim: #9ba1c7;
        --faint: #7e85ae;
        --line: rgba(151, 146, 255, 0.16);
        --card: #121320;
        --accent: #8b7ef6;
        --sage: #45d6c8;
        --font: Inter, system-ui, sans-serif;
        --mono: 'JetBrains Mono', ui-monospace, monospace;
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body {
        width: 1080px; height: 1080px; overflow: hidden;
        background: var(--ground); font-family: var(--font); color: var(--ink);
      }
      #root {
        position: relative; width: 1080px; height: 1080px;
        display: flex; align-items: center; justify-content: center;
        background:
          radial-gradient(680px 420px at 22% 8%, rgba(139, 126, 246, 0.16), transparent 70%),
          radial-gradient(560px 380px at 88% 92%, rgba(69, 214, 200, 0.1), transparent 72%),
          var(--ground);
      }
      .stage { width: 860px; }
      .eyebrow {
        font-family: var(--mono); font-size: 19px; letter-spacing: 0.18em;
        text-transform: uppercase; color: var(--faint); margin-bottom: 14px;
      }
      h1 { font-size: 62px; font-weight: 700; letter-spacing: -0.03em; line-height: 1.05; }
      h1 span { color: var(--accent); }

      .form { margin-top: 54px; display: flex; flex-direction: column; gap: 22px; }
      .field {
        border: 1px solid var(--line); border-radius: 18px; background: var(--card);
        padding: 22px 26px; position: relative; overflow: hidden;
      }
      .field .lbl {
        font-family: var(--mono); font-size: 15px; letter-spacing: 0.14em;
        text-transform: uppercase; color: var(--faint); margin-bottom: 10px;
      }
      .field .val { font-size: 30px; font-weight: 600; color: var(--ink); white-space: nowrap; }
      .field .val.mono { font-family: var(--mono); font-size: 24px; font-weight: 500; }
      .field .val.ph { color: var(--faint); font-weight: 500; }
      .field .tick {
        position: absolute; right: 24px; top: 50%; width: 34px; height: 34px;
        margin-top: -17px; border-radius: 50%; background: var(--sage); opacity: 0;
      }
      .field .tick svg { display: block; width: 34px; height: 34px; }
      .mask { position: absolute; left: 0; top: 0; height: 100%; width: 100%; background: var(--card); }

      .cta {
        margin-top: 34px; height: 74px; border-radius: 16px; background: var(--accent);
        display: flex; align-items: center; justify-content: center; gap: 12px;
        font-size: 27px; font-weight: 700; color: #0b0a14; letter-spacing: -0.01em;
      }
      .cta .ok { opacity: 0; }
      .caption {
        margin-top: 42px; font-size: 26px; line-height: 1.45; color: var(--dim);
      }
      .caption b { color: var(--ink); font-weight: 600; }
      .glow {
        position: absolute; width: 900px; height: 900px; border-radius: 50%;
        background: radial-gradient(circle, rgba(139, 126, 246, 0.18), transparent 62%);
        left: 50%; top: 50%; transform: translate(-50%, -50%); pointer-events: none;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="10"
      data-width="1080"
      data-height="1080"
    >
      <div class="glow"></div>

      <div class="stage">
        <div id="head" class="clip" data-start="0" data-duration="10" data-track-index="0">
          <p class="eyebrow">Moonfin</p>
          <h1>Add your <span>server</span></h1>
        </div>

        <div class="form">
          <div id="f1" class="clip field" data-start="0.6" data-duration="9.4" data-track-index="0">
            <div class="lbl">Server address</div>
            <div id="v1" class="val mono">aiostreams.mysweetpea.cc/jellyfin/••••••</div>
            <div class="mask" id="m1"></div>
            <div class="tick" id="t1">
              <svg viewBox="0 0 34 34" fill="none"><path d="M9 17.5l5.5 5.5L25 12" stroke="#08090f" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
            </div>
          </div>

          <div id="f2" class="clip field" data-start="2.6" data-duration="7.4" data-track-index="0">
            <div class="lbl">Your name</div>
            <div id="v2" class="val">alex</div>
            <div class="mask" id="m2"></div>
            <div class="tick" id="t2">
              <svg viewBox="0 0 34 34" fill="none"><path d="M9 17.5l5.5 5.5L25 12" stroke="#08090f" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
            </div>
          </div>

          <div id="f3" class="clip field" data-start="4.4" data-duration="5.6" data-track-index="0">
            <div class="lbl">PIN</div>
            <div id="v3" class="val mono">••••••</div>
            <div class="mask" id="m3"></div>
            <div class="tick" id="t3">
              <svg viewBox="0 0 34 34" fill="none"><path d="M9 17.5l5.5 5.5L25 12" stroke="#08090f" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
            </div>
          </div>
        </div>

        <div id="cta" class="clip" data-start="6.2" data-duration="3.8" data-track-index="0">
          <div class="cta"><span id="cta-txt">Connect</span><span id="cta-done" class="ok">Connected ✓</span></div>
        </div>

        <div id="cap" class="clip" data-start="7.4" data-duration="2.6" data-track-index="0">
          <p class="caption">All three live on your <b>dashboard</b> — copy the address, then use your name and PIN.</p>
        </div>
      </div>
    </div>

    <script>
      const tl = gsap.timeline({ paused: true });
      const E = 'power3.out';

      // head
      tl.fromTo('#head .eyebrow', { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.7, ease: E }, 0);
      tl.fromTo('#head h1', { opacity: 0, y: 22 }, { opacity: 1, y: 0, duration: 0.85, ease: E }, 0.06);

      // field 1 — address pastes in
      tl.fromTo('#f1', { opacity: 0, y: 26 }, { opacity: 1, y: 0, duration: 0.7, ease: E }, 0.6);
      tl.fromTo('#m1', { x: 0 }, { x: '101%', duration: 0.85, ease: 'power2.inOut' }, 1.1);
      tl.fromTo('#t1', { opacity: 0, scale: 0.6 }, { opacity: 1, scale: 1, duration: 0.4, ease: 'back.out(2)' }, 1.95);

      // field 2 — name
      tl.fromTo('#f2', { opacity: 0, y: 26 }, { opacity: 1, y: 0, duration: 0.7, ease: E }, 2.6);
      tl.fromTo('#m2', { x: 0 }, { x: '101%', duration: 0.6, ease: 'power2.inOut' }, 3.05);
      tl.fromTo('#t2', { opacity: 0, scale: 0.6 }, { opacity: 1, scale: 1, duration: 0.4, ease: 'back.out(2)' }, 3.7);

      // field 3 — pin
      tl.fromTo('#f3', { opacity: 0, y: 26 }, { opacity: 1, y: 0, duration: 0.7, ease: E }, 4.4);
      tl.fromTo('#m3', { x: 0 }, { x: '101%', duration: 0.6, ease: 'power2.inOut' }, 4.85);
      tl.fromTo('#t3', { opacity: 0, scale: 0.6 }, { opacity: 1, scale: 1, duration: 0.4, ease: 'back.out(2)' }, 5.5);

      // connect
      tl.fromTo('#cta', { opacity: 0, y: 18 }, { opacity: 1, y: 0, duration: 0.6, ease: E }, 6.2);
      tl.fromTo('#cta .cta', { scale: 1 }, { scale: 0.965, duration: 0.12, ease: 'power1.in' }, 7.0);
      tl.to('#cta .cta', { scale: 1, duration: 0.3, ease: 'back.out(2.4)' }, 7.12);
      tl.to('#cta .cta', { backgroundColor: '#45d6c8', duration: 0.3, ease: 'power1.out' }, 7.12);
      tl.to('#cta-txt', { opacity: 0, duration: 0.12 }, 7.12);
      tl.fromTo('#cta-done', { opacity: 0, y: 8 }, { opacity: 1, y: 0, duration: 0.32, ease: 'back.out(2)' }, 7.2);

      // caption
      tl.fromTo('#cap', { opacity: 0, y: 16 }, { opacity: 1, y: 0, duration: 0.7, ease: E }, 7.6);

      // slow drift so the last two seconds are not a freeze
      tl.to('.stage', { y: -10, duration: 2.4, ease: 'sine.inOut' }, 7.6);

      window.__timelines['main'] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
