name = "dashboard"
main = "src/index.ts"
compatibility_date = "2026-09-01"

# Custom domain — DECLARED (restore-by-deploy; a worker delete also deletes the
# custom domain's DNS, learned the hard way Sep 27 2026). Also bound in CF dashboard.
routes = [
  { pattern = "dashboard.mysweetpea.cc", custom_domain = true }
]

[[kv_namespaces]]
binding = "SESSIONS"
id = "8fdd1c40796c413ebbd479c42c90ef44"

[vars]
# authentik 2026.8: authorize/token are GENERIC (not slug-scoped)
AUTH_ISSUER = "https://auth.mysweetpea.cc/application/o"
AUTH_BASE = "https://auth.mysweetpea.cc"
APP_URL = "https://dashboard.mysweetpea.cc"
JELLYFIN_USER_ID = "3d75456ef9c5438480195d731242133d"
# Seerr origin (non-secret; the API key is a Worker secret: SEERR_API_KEY)
SEERR_URL = "https://request.mysweetpea.cc"
# SPA deployment config (/api/config): site + contact, env-overridable
MAIN_SITE_URL = "https://mysweetpea.cc"
SUPPORT_EMAIL = "support@mysweetpea.cc"
# commits source repo for the changelog/updates feed ('owner/name')
GH_COMMITS_REPO = "mysweetpea/mysweetpea-homelab"

# Secrets (set via `npx wrangler secret put ...`):
#   AUTHENTIK_CLIENT_ID
#   MSP_INTERNAL_HEADER

[assets]
directory = "./public"
binding = "ASSETS"
not_found_handling = "single-page-application"
# Only dynamic routes invoke the Worker script (probe-verified on this account):
#   /api/*  — every API route
#   /auth/* — login/callback/land/logout/ceremony
# Everything else (the 260 KB SPA shell, fonts, icons, videos) is served by the
# static-assets layer: free, unlimited, no invocation, no CPU, and it cannot
# ever hit the 10 ms CPU cap. Previously `true` sent EVERY request through the
# script. Security headers for asset responses now live in `_headers` (worker-set
# headers do not apply to asset-layer responses).
run_worker_first = ["/api/*", "/auth/*"]
